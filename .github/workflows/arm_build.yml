name: Build YAAP for blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted   # <-- REQUIRES your own registered runner (VM/PC with real disk+RAM)
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig ccache patchelf \
            coreutils openjdk-17-jdk

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init
        run: |
          mkdir -p ~/yaap-src && cd ~/yaap-src
          repo init -u https://github.com/yaap/manifest.git -b sixteen --depth=1 --git-lfs

      - name: Add local manifest
        run: |
          cd ~/yaap-src
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/local_manifests.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="gh" fetch="https://github.com" />
            <remote name="gitlab1" fetch="https://gitlab.com" />
            <remote name="cb" fetch="https://codeberg.org" />
            <remote name="ab" fetch="https://github.com/Alromine95" />
            <project name="device_xiaomi_blossom" path="device/xiaomi/blossom" remote="ab" revision="16.2" />
            <project name="HaiKito18/android_device_mediatek_sepolicy_vndr_lineage23" path="device/mediatek/sepolicy_vndr" remote="gh" revision="lineage-23.2" />
            <project name="HaiKito18/vendor_xiaomi_miuicamera" path="vendor/xiaomi/miuicamera" remote="gh" revision="main" />
            <project name="haikito18/proprietary_vendor_xiaomi_blossom" path="vendor/xiaomi/blossom" remote="gitlab1" revision="A16-qpr2" />
            <project path="device/xiaomi/blossom-kernel" name="xc112lg/android_device_xiaomi_blossom-kernel" remote="gh" revision="main">
              <linkfile src="headers" dest="kernel/xiaomi/blossom" />
            </project>
            <project path="hardware/mediatek" name="haikito18/android_hardware_mediatek" remote="gitlab1" revision="lineage-23.2" />
            <project name="HaiKito18/ViaBrowser" path="packages/apps/ViaBrowser" remote="gh" revision="main" />
            <project name="HaiKito18/Dolby-blossom" path="hardware/dolby" remote="cb" revision="sony-1.5" />
            <project path="packages/apps/RevampedFMRadio" name="TracenPlayground/packages_apps_RevampedFMRadio" remote="gh" revision="mtk" />
            <remove-project path="packages/apps/FMRadio"/>
          </manifest>
          EOF

      - name: Repo sync
        run: |
          cd ~/yaap-src
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Fix build_soong source
        run: |
          cd ~/yaap-src
          rm -rf build/soong
          git clone https://github.com/yaap/build_soong.git -b sixteen build/soong
          sed -i 's/"golang.org\/x\/exp\/maps"/& \n\t"sort"/' build/soong/ui/execution_metrics/execution_metrics.go
          sed -i 's/slices\.Sorted(maps\.Keys(\([^)]*\)))/func() []string { keys := make([]string, 0, len(\1)); for k := range \1 { keys = append(keys, k) }; sort.Strings(keys); return keys }()/' build/soong/ui/execution_metrics/execution_metrics.go

      - name: Build
        run: |
          cd ~/yaap-src
          source build/envsetup.sh
          lunch yaap_blossom-bp2a-userdebug
          m installclean
          m yaap

      - name: Upload to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USERNAME }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
        run: |
          cd ~/yaap-src
          ZIP=$(find out/target/product/blossom -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            rsync -avP -e ssh "$ZIP" "${SF_USER}@frs.sourceforge.net:/home/frs/project/YOUR_PROJECT_NAME/"
          else
            echo "No ROM ZIP found!"
            exit 1
          fi
