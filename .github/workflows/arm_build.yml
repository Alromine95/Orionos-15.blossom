name: Zero-Setup Direct Arch Link

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upterm-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Secure Direct Upterm Tunnel
        uses: upterm/upterm-action@v2
        with:
          # This tells the cloud runner to pause and wait for your local terminal
          limit-access-to-actor: false
