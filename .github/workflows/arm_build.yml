name: Ngrok SSH ROM Builder
on: workflow_dispatch

jobs:
  ssh_terminal:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Storage Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 20480
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'

    - name: Install Android Build Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2-utils squashfs-tools zip

    - name: Start Ngrok SSH Session
      uses: lhotari/action-ngrok-ssh@v1
      with:
        ngrok_auth_token: ${{ secrets.NGROK_TOKEN }}
        ssh_password: 'build_password_123' # Put any temporary password here
