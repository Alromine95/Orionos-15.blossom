name: Free SSH Server
on: [workflow_dispatch] # Allows you to start it manually

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true # Secures the session to your GitHub account only
