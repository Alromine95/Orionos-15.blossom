name: Connect PC to GitHub Actions Cloud Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ssh-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Server on Cloud Runner
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # Set a quick temporary password for the runner user just in case
          echo "runner:password123" | sudo chpasswd

      - name: Launch Pinggy SSH Tunnel
        run: |
          echo "=== COPY AND RUN THE COMMAND GENERATED BELOW ==="
          # ⬇️ CHANGED USER TO 'tcp' AND HOOKED BACK TO THE VALID 'a.pinggy.io'
          ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:22 tcp@a.pinggy.io
