name: Connect PC to GitHub Actions Cloud Runner

on:
  workflow_dispatch:

jobs:
  ssh-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Server on Cloud Runner
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # Set a quick temporary password for the runner user just in case
          echo "runner:password123" | sudo chpasswd

      - name: Launch ngrok SSH Tunnel
        run: |
          # Install ngrok via snap
          sudo snap install ngrok
          
          # ⬇️ FIX THE PERMISSION DENIED ERROR: Create the folder structure manually
          mkdir -p /home/runner/.config/ngrok
          
          # Authenticate using sudo to bypass sandboxing blocks
          sudo ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          
          echo "=== COPY THE SSH COMMAND BELOW ==="
          sudo ngrok tcp 22
