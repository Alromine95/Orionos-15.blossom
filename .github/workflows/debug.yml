name: Send Commands from PC to GitHub Actions

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website

jobs:
  interactive-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Secure Terminal Bridge
        uses: mxschmitt/action-tmate@v3
        with:
          # This keeps the cloud terminal open and waiting for your PC's commands
          limit-access-to-actor: false
