name: Connect PC to GitHub Actions Cloud Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ssh-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main
        
      - name: Initialize workspace on the large disk
        id: pwd
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown -R "$USER:$USER" /mnt/workspace
          echo "workspace-folder=/mnt/workspace" >> "$GITHUB_OUTPUT"
          df -h

      - name: Create 16GB swap
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git aria2 ccache python3 python-is-python3 bc bison build-essential \
            curl flex g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev unzip

          sudo curl --create-dirs -L \
            -o /usr/local/bin/repo \
            https://storage.googleapis.com/git-repo-downloads/repo

          sudo chmod a+rx /usr/local/bin/repo

          repo --version


      - name: Configure SSH Server on Cloud Runner
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # Set a quick temporary password for the runner user just in case
          echo "runner:password123" | sudo chpasswd
          
      - name: Launch Pinggy SSH Tunnel
        run: |
          echo "=== COPY AND RUN THE COMMAND GENERATED BELOW ==="
          # ⬇️ CHANGED USER TO 'tcp' AND HOOKED BACK TO THE VALID 'a.pinggy.io'
          ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:22 tcp@a.pinggy.io
