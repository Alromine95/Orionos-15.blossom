name: Connect PC to GitHub Actions Cloud Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ssh-bridge:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      # ---------------------------------------------------------
      # WORKSPACE + BTRFS ZSTD COMPRESSION (JUGAAD)
      # ---------------------------------------------------------

      - name: Initialize compressed Btrfs workspace
        id: pwd
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs zram-tools

          sudo mkdir -p /mnt/workspace/build
          sudo chown -R "$USER:$USER" /mnt/workspace

          # Create 200GB sparse Btrfs container with ZSTD compression & async discard
          truncate -s 200G /mnt/workspace/rom.img
          mkfs.btrfs -f /mnt/workspace/rom.img
          sudo mount -o loop,compress=zstd:3,noatime,discard=async /mnt/workspace/rom.img /mnt/workspace/build
          sudo chown -R "$USER:$USER" /mnt/workspace/build

          echo "workspace-folder=/mnt/workspace/build" >> "$GITHUB_OUTPUT"
          df -h / /mnt/workspace/build

      # ---------------------------------------------------------
      # ZRAM (ZERO-DISK SWAP)
      # ---------------------------------------------------------

      - name: Enable ZRAM instead of disk swapfile
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          echo -e "ALGO=zstd\nPERCENT=50" | sudo tee /etc/default/zramswap
          sudo systemctl restart zramswap
          swapon --show
          free -h

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 22

      # ---------------------------------------------------------
      # DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            git aria2 ccache python3 python-is-python3 bc bison build-essential \
            curl flex g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev unzip openssh-server tmux

          sudo curl --create-dirs -L \
            -o /usr/local/bin/repo \
            https://storage.googleapis.com/git-repo-downloads/repo

          sudo chmod a+rx /usr/local/bin/repo
          repo --version

      # ---------------------------------------------------------
      # SSH SERVER WITH PASSWORD + KEY AUTH
      # ---------------------------------------------------------

      - name: Configure SSH Server
        run: |
          sudo systemctl enable ssh
          sudo systemctl start ssh

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${{ secrets.SSH_PUBLIC_KEY }}" ]; then
            echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
          fi

          sudo chown -R "$USER:$USER" ~/.ssh

          # Generate a secure random password for this runner session
          SSH_PASS=$(openssl rand -base64 12)
          echo "runner:$SSH_PASS" | sudo chpasswd
          echo "SSH_PASS=$SSH_PASS" >> "$GITHUB_ENV"

          # Enable password login in sshd_config
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          sudo rm -f /etc/ssh/sshd_config.d/*cloudimg*.conf
          sudo systemctl restart ssh

          echo "SSH server ready"
          sudo ss -lntp | grep ':22' || true

      # ---------------------------------------------------------
      # TAILSCALE
      # ---------------------------------------------------------

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      # ---------------------------------------------------------
      # DISPLAY SSH INFORMATION (WITH PASSWORD)
      # ---------------------------------------------------------

      - name: Display SSH connection information
        run: |
          TS_IP=$(tailscale ip -4)

          echo "=============================================="
          echo "       GITHUB ACTIONS RUNNER READY"
          echo "=============================================="
          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo ""
          echo "SSH command:"
          echo "ssh runner@$TS_IP"
          echo ""
          echo "Password:"
          echo "$SSH_PASS"
          echo ""
          echo "Build folder (ZSTD Compressed):"
          echo "/mnt/workspace/build"
          echo "=============================================="

      # ---------------------------------------------------------
      # TMUX
      # ---------------------------------------------------------

      - name: Start tmux
        run: |
          tmux new-session -d -s romshell -c /mnt/workspace/build || true
          tmux list-sessions

      # ---------------------------------------------------------
      # KEEP RUNNER ALIVE
      # ---------------------------------------------------------

      - name: Keep runner alive
        run: |
          echo "Runner is now available over Tailscale."
          echo "SSH into it from your PC."

          while true; do
            echo "Runner alive - $(date)"
            sleep 60
          done
