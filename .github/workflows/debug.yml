name: Connect PC to GitHub Actions Cloud Runner

# ⬇️ THIS TRIGGERS THE WORKFLOW AUTOMATICALLY ON EVERY COMMIT
on:
  push:
    branches:
      - main
  workflow_dispatch: # Keeps the manual run button active just in case

jobs:
  ssh-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Server on Cloud Runner
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # Set a quick temporary password for the runner user just in case
          echo "runner:password123" | sudo chpasswd

      - name: Launch Pinggy SSH Tunnel
        run: |
          echo "=== CONNECT VIA THE COMMAND PRINTED BELOW ==="
          # Creates a secure reverse SSH tunnel over standard web traffic rules
          ssh -o StrictHostKeyChecking=no -R 0:localhost:22 loop@a.pinggy.io
