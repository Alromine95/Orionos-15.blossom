name: Connect PC to GitHub Actions Cloud Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ssh-bridge:
    runs-on: ubuntu-16-core

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      


      # ---------------------------------------------------------
      # WORKSPACE
      # ---------------------------------------------------------

      - name: Initialize workspace on the large disk
        id: pwd
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown -R "$USER:$USER" /mnt/workspace
          echo "workspace-folder=/mnt/workspace" >> "$GITHUB_OUTPUT"
          df -h

      # ---------------------------------------------------------
      # SWAP
      # ---------------------------------------------------------

      - name: Create 16GB swap
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 22

      # ---------------------------------------------------------
      # DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git aria2 ccache python3 python-is-python3 bc bison build-essential \
            curl flex g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev unzip openssh-server tmux

          sudo curl --create-dirs -L \
            -o /usr/local/bin/repo \
            https://storage.googleapis.com/git-repo-downloads/repo

          sudo chmod a+rx /usr/local/bin/repo

          repo --version

      # ---------------------------------------------------------
      # SSH SERVER
      # ---------------------------------------------------------

      - name: Configure SSH Server
        run: |
          sudo systemctl enable ssh
          sudo systemctl start ssh

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo chown -R "$USER:$USER" ~/.ssh

          echo "SSH server ready"

          echo
          echo "SSH listening:"
          sudo ss -lntp | grep ':22' || true

      # ---------------------------------------------------------
      # TAILSCALE
      # ---------------------------------------------------------

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner

      # ---------------------------------------------------------
      # CHECK TAILSCALE
      # ---------------------------------------------------------

      - name: Check Tailscale
        run: |
          echo "=============================================="
          echo "TAILSCALE STATUS"
          echo "=============================================="

          echo
          echo "=== IP ==="
          tailscale ip -4

          echo
          echo "=== STATUS ==="
          tailscale status

          echo
          echo "=== SELF ==="
          tailscale status --self

          echo
          echo "=== NETCHECK ==="
          tailscale netcheck || true

      # ---------------------------------------------------------
      # DEBUG SSH
      # ---------------------------------------------------------

      - name: Debug SSH
        run: |
          echo "=== SSH PORT ==="
          sudo ss -lntp | grep ':22' || true

          echo
          echo "=== SSH SERVICE ==="
          sudo systemctl status ssh --no-pager || true

      # ---------------------------------------------------------
      # DISPLAY SSH INFORMATION
      # ---------------------------------------------------------

      - name: Display SSH connection information
        run: |
          TS_IP=$(tailscale ip -4)

          echo "=============================================="
          echo "       GITHUB ACTIONS RUNNER READY"
          echo "=============================================="

          echo
          echo "Tailscale IP:"
          echo "$TS_IP"

          echo
          echo "SSH command:"
          echo "ssh runner@$TS_IP"

          echo
          echo "=============================================="

      # ---------------------------------------------------------
      # TMUX
      # ---------------------------------------------------------

      - name: Start tmux
        run: |
          tmux new-session -d -s romshell || true
          tmux list-sessions

      # ---------------------------------------------------------
      # KEEP RUNNER ALIVE
      # ---------------------------------------------------------

      - name: Keep runner alive
        run: |
          echo "Runner is now available over Tailscale."
          echo "SSH into it from your PC."

          while true; do
            echo "Runner alive - $(date)"
            sleep 60
          done
